name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Runner preflight
        run: bash scripts/runner-preflight.sh
      - name: Install deps
        run: npm ci
      - name: Quality gate
        run: npm run check
      - name: Smoke (server /health)
        run: npm run smoke
      - name: NPM audit
        run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  codeql:
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Runner preflight
        run: bash scripts/runner-preflight.sh
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v4

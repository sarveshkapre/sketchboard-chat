name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Quality gate
        run: npm run check
      - name: Smoke (server /health)
        run: |
          set -euo pipefail
          PORT=4100 node server/index.mjs &
          pid=$!
          trap "kill $pid 2>/dev/null || true" EXIT

          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:4100/health" >/dev/null; then
              curl -fsS "http://localhost:4100/health"
              exit 0
            fi
            sleep 0.5
          done

          curl -fsS "http://localhost:4100/health"
      - name: NPM audit
        run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v4
